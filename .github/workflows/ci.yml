name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Allow the deploy-demo workflow to reuse this suite as a gate.
  workflow_call:

jobs:
  backend:
    name: Backend - lint, audit, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (including dev)
        run: cd backend && uv sync

      - name: Lint (ruff + mypy)
        run: cd backend && uv run ruff check . && uv run mypy app

      - name: Security audit - dependency CVE gate
        # CVE-2026-33634: litellm 1.82.7 and 1.82.8 are compromised.
        # This gate must pass before any docker compose build step.
        run: make audit-deps

      - name: Unit tests
        run: cd backend && uv run pytest -m "not integration" -x -q

      - name: "Cross-file pollution regression gate"
        run: make test-pollution-check

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build containers
        run: docker compose -f ops/docker-compose.yml build
