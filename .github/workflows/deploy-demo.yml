name: Deploy demo

# Builds the IntelliBird images and pushes them to GitHub Container Registry
# (GHCR) whenever main advances. The demo host behind
# https://intellibird.whisperegate.org pulls these tags and restarts the stack
# (see ops/docker-compose.demo.yml). CI itself never touches the host.

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  # Gate the push on the same lint/audit/test suite the CI workflow runs.
  ci-gate:
    name: Lint, audit, test
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api image — shared by the api, worker, scheduler and certstream services.
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # web image — Next.js edge/UI.
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: ops/web.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # db image — Postgres with the required extensions baked in.
      - name: Build & push db
        uses: docker/build-push-action@v6
        with:
          context: ops
          file: ops/db.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-db:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/intellibird-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Demo images pushed to GHCR"
            echo ""
            echo "Tags: \`latest\` and \`${GITHUB_SHA}\`"
            echo ""
            echo "| Image |"
            echo "| --- |"
            echo "| ${REGISTRY}/${{ steps.owner.outputs.value }}/intellibird-api |"
            echo "| ${REGISTRY}/${{ steps.owner.outputs.value }}/intellibird-web |"
            echo "| ${REGISTRY}/${{ steps.owner.outputs.value }}/intellibird-db |"
            echo ""
            echo "Host (intellibird.whisperegate.org) pulls & restarts via:"
            echo '```'
            echo "GHCR_OWNER=${{ steps.owner.outputs.value }} \\"
            echo "  docker compose -f ops/docker-compose.yml -f ops/docker-compose.demo.yml pull"
            echo "GHCR_OWNER=${{ steps.owner.outputs.value }} \\"
            echo "  docker compose -f ops/docker-compose.yml -f ops/docker-compose.demo.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
