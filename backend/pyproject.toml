[project]
name = "intellibird-backend"
version = "0.1.0"
description = "IntelliBird backend — FastAPI + workers + Alembic"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "gunicorn>=22,<23",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "dramatiq[redis]>=1.17,<2",
  "apscheduler>=3.10,<4",
  "structlog>=24.1,<26",
  "asgi-correlation-id>=4,<5",
  "stix2==3.0.2",
  "taxii2-client==2.3.0",
  "httpx>=0.27,<0.28",
  "redis>=5,<6",
  "psycopg2-binary>=2.9,<3",
  "feedparser==6.0.12",
  "nvdlib>=0.8,<0.9",
  "cryptography>=42,<43",
  "lxml>=5,<6",
  "cssselect>=1.2,<2",
  "geoip2>=4.8,<5",
  "PyJWT>=2.12,<3",
  "pwdlib[argon2]>=0.2,<0.3",
  "authlib>=1.6,<2",
  "dnstwist>=20240219",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-docker>=3,<4",
  "testcontainers[postgres,redis]>=4.8,<5",
  "httpx>=0.27,<0.28",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "aiosqlite>=0.22.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not load'"
markers = [
  "integration: marks tests that require docker/testcontainers (deselect with '-m \"not integration\"')",
  "load: long-running load test; excluded by default (run with `-m load`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
