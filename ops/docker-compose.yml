# IntelliBird M1 — Docker Compose stack
# Phase 1 / Foundation. Six services. Loopback-only host port bindings.
#
# IMPORTANT: M1 has NO AUTHENTICATION. All published ports bind to 127.0.0.1
# ONLY on the host. Do NOT change host bindings to 0.0.0.0 or ::. Auth is M2.

services:

  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    image: intellibird-db:m1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ops/api.Dockerfile
    image: intellibird-api:m1
    command: ["sh", "-c", "cd /app && alembic upgrade head && gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: intellibird-api:m1
    command: dramatiq app.workers.broker --processes 1 --threads 4
    env_file: .env
    environment:
      GEOLITE_PATH: /app/geolite/GeoLite2-City.mmdb
    volumes:
      # Named volume shared with `geoip-update` profile service.
      # Fallback to ./geolite bind if operator prefers host-managed:
      #   volumes: [./geolite:/app/geolite:ro]
      - geoip:/app/geolite:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    image: intellibird-api:m1
    command: python -m app.scheduler.jobs
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: ../ops/web.Dockerfile
    image: intellibird-web:m1
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      BACKEND_URL: http://api:8000
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy

  # On-demand GeoLite2 downloader. Pulls City/ASN/Country mmdb via jsDelivr
  # from wp-statistics/geolite2-* packages (no MaxMind account needed).
  # Run explicitly:  docker compose --profile geoip run --rm geoip-update
  # Then restart workers: docker compose restart worker scheduler
  geoip-update:
    image: alpine/curl:latest
    profiles: ["geoip"]
    volumes:
      - geoip:/geoip
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Downloading GeoLite2 databases (wp-statistics / jsDelivr)..."
        for db in City ASN Country; do
          lc=$$(echo $$db | tr A-Z a-z)
          url="https://cdn.jsdelivr.net/npm/geolite2-$$lc/GeoLite2-$$db.mmdb.gz"
          curl -sSL -o /geoip/GeoLite2-$$db.mmdb.gz "$$url"
          gunzip -f /geoip/GeoLite2-$$db.mmdb.gz
          echo "  $$db DB downloaded"
        done
        ls -lh /geoip/*.mmdb
        echo "Done."

volumes:
  pg_data:
  redis_data:
  geoip:
