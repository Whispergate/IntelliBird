<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntelliBird Lookup - Options</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 480px; }
    h1 { font-size: 1.1rem; margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input[type="url"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    button { margin-top: 12px; padding: 8px 20px; background: #1D9E75; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #178860; }
    #status { margin-top: 10px; font-size: 0.85rem; color: #1D9E75; min-height: 1.2em; }
    .hint { font-size: 0.8rem; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>IntelliBird Lookup - Settings</h1>
  <label for="url">IntelliBird Base URL</label>
  <input id="url" type="url" placeholder="https://intellibird.internal" autocomplete="off">
  <p class="hint">Enter the origin of your IntelliBird instance (no trailing slash needed).</p>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="browser-polyfill.min.js"></script>
  <script src="options.js"></script>
</body>
</html>
